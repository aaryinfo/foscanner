body {
  height: 100vh;
  background: #0B0F1A;
  color: #D0DBF0;
  font-family: 'Inter', sans-serif;
  display: flex;

  justify-content: center;

.payment-box {

  text-decoration: none;

.btn:hover {

.btn-outline {
